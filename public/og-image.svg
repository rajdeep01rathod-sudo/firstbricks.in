    <rect x="230" width="240" height="42" rx="10" fill="#1E293B"/>
    <text x="246" y="27" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="700" fill="#E2E8F0">
      🔒 100% In-Browser Private
    </text>
