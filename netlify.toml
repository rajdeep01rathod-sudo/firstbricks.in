[build]
  command = "npm run build"
  publish = "dist"

# Single Page Application (SPA) routing: ensures all subroutes load index.html without 404 errors
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Optimized caching and security headers for Netlify CDN
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
